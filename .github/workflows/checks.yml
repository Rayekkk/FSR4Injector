name: Quality checks

# Tests only. Releases are made by hand from a tag.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'  # Decky Loader's own interpreter
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-2022
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run backend tests
        run: python -W error -m unittest discover -s tests -p "test_*.py" -v

  frontend-package:
    name: Frontend and package (Node.js 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check frontend types
        run: npm run typecheck
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Run frontend regression tests
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build
      - name: Build package (checks required files and that no AMD file is inside)
        run: npm run package

  shim:
    name: Shim builds with MinGW-w64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # The self-test needs AMD's DLL, which may not be redistributed, so CI only checks that the shim compiles
      # cleanly and exports what amdxc64 must export.
      - name: Compile shim and self-test
        run: CFLAGS_EXTRA=-Werror bash shim/build.sh
      - name: Check exports
        run: |
          x86_64-w64-mingw32-objdump -p shim/build/amdxc64.dll | tee exports.txt | grep -q AmdExtD3DCreateInterface
          grep -q AmdGetDxcModuleHandle exports.txt
